server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Chat IA streamé (SSE) : buffering nginx désactivé, sinon nginx retient toute la réponse
  # et la livre d'un coup à la fin — annule tout l'intérêt du streaming côté backend
  # (retour utilisateur du 17 août 2026 : « le streaming a disparu »). Plus spécifique que le
  # bloc /projet/ ci-dessous donc prioritaire (préfixe le plus long l'emporte chez nginx).
  location /projet/api/ai/ {
    proxy_pass http://backend:8089/projet/api/ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_set_header Connection '';
  }

  # Proxy API calls to the backend container on the compose network
  # Timeouts élevés : Ollama (CPU) peut dépasser 60s sur /api/ai/*
  location /projet/ {
    proxy_pass http://backend:8089/projet/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  # Angular SPA: route everything to index.html
  # index.html référence les noms de fichiers hashés (main.<hash>.js, <n>.<hash>.js) -- s'il reste
  # en cache navigateur après un déploiement, le navigateur continue de charger les VIEUX bundles
  # indéfiniment (jusqu'à 30j, cf. la règle de cache agressive ci-dessous) même si le serveur a bien
  # les nouveaux fichiers : "Actualiser" en apparence sans effet côté utilisateur alors que le
  # correctif est bien déployé (retour utilisateur du 28 août 2026, refresh=true sur Quality Gate).
  # index.html doit donc TOUJOURS être revalidé, jamais servi depuis le cache navigateur.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  # Fichiers statiques hashés par le build (main.<hash>.js, styles.<hash>.css, ...) : cache long
  # sûr car un changement de contenu change le nom de fichier -- seul index.html (ci-dessus) doit
  # rester non caché pour que le navigateur découvre les nouveaux noms à chaque déploiement.
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
