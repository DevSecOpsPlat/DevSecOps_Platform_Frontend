services:
  db:
    image: postgres:16-alpine
    container_name: envirotest-postgres
    environment:
      POSTGRES_DB: EnviroTest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../DevSecOps_Platform_Backend
      dockerfile: Dockerfile
    container_name: envirotest-backend
    depends_on:
      - db
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/EnviroTest
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      APP_SECURITY_TRUST_LOCALHOST: "false"
      SERVER_PORT: 8089
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://envirotest.cloud}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://envirotest.local:4200,http://envirotest.local,https://envirotest.cloud,http://envirotest.cloud}
      K8S_API_URL: ${K8S_API_URL:-https://192.168.92.10:6443}
      K8S_TOKEN: ${K8S_TOKEN:-}
      K8S_INSECURE_SKIP_TLS_VERIFY: ${K8S_INSECURE_SKIP_TLS_VERIFY:-true}
      DEPLOYMENT_INGRESS_DOMAIN: ${DEPLOYMENT_INGRESS_DOMAIN:-192.168.92.10.nip.io}
      DEPLOYMENT_PREVIEW_NIP_MASTER_IP: ${DEPLOYMENT_PREVIEW_NIP_MASTER_IP:-192.168.92.10}
      DEPLOYMENT_PIPELINE_REF: ${DEPLOYMENT_PIPELINE_REF:-master}
      PIPELINE_SECRET: ${PIPELINE_SECRET:-}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # docker = BASE_URL /projet/ (local) | hostinger = https://api.envirotest.cloud/projet/
        ANGULAR_CONFIG: ${ANGULAR_CONFIG:-docker}
    container_name: envirotest-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
