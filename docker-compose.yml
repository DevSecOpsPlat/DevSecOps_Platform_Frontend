services:
  db:
    image: postgres:16-alpine
    container_name: envirotest-postgres
    environment:
      POSTGRES_DB: EnviroTest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../DevSecOps_Platform_Backend
      dockerfile: Dockerfile
    container_name: envirotest-backend
    depends_on:
      - db
    ports:
      - "8089:8089"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/EnviroTest
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      APP_SECURITY_TRUST_LOCALHOST: "false"
      SERVER_PORT: 8089
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4200}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://envirotest.local:4200,http://envirotest.local,https://envirotest.cloud,http://envirotest.cloud}
      K8S_API_URL: ${K8S_API_URL:-https://192.168.92.10:6443}
      K8S_TOKEN: ${K8S_TOKEN:-}
      K8S_INSECURE_SKIP_TLS_VERIFY: ${K8S_INSECURE_SKIP_TLS_VERIFY:-true}
      DEPLOYMENT_INGRESS_DOMAIN: ${DEPLOYMENT_INGRESS_DOMAIN:-192.168.92.10.nip.io}
      DEPLOYMENT_PREVIEW_NIP_MASTER_IP: ${DEPLOYMENT_PREVIEW_NIP_MASTER_IP:-192.168.92.10}
      # Traefik est installé via Helm dans son propre namespace "traefik" sur ce cluster
      # (pas kube-system, contrairement au Traefik intégré par défaut de K3s) — la NetworkPolicy
      # "default-isolation" générée par AppK8sManifestService doit autoriser explicitement ce
      # namespace en entrée, sinon les pods planifiés sur un autre nœud que Traefik (ex. worker)
      # rejettent tout le trafic de l'ingress (REJECT icmp-port-unreachable, masqué en local
      # jusqu'ici uniquement parce que Traefik et les pods partageaient toujours le même nœud).
      DEPLOYMENT_NETWORK_POLICY_INGRESS_NAMESPACE: ${DEPLOYMENT_NETWORK_POLICY_INGRESS_NAMESPACE:-traefik}
      DEPLOYMENT_PIPELINE_REF: ${DEPLOYMENT_PIPELINE_REF:-master}
      PIPELINE_SECRET: ${PIPELINE_SECRET:-}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      # Conteneur Ollama sur le même réseau Docker (nom DNS : ollama)
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://ollama:11434}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # docker = BASE_URL /projet/ (local) | hostinger = https://api.envirotest.cloud/projet/
        ANGULAR_CONFIG: ${ANGULAR_CONFIG:-docker}
    container_name: envirotest-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

  # Reverse proxy Nginx — WAF léger + rate limiting, point d'entrée unique (chapitre 6 du rapport)
  nginx:
    image: nginx:1.27-alpine
    container_name: envirotest-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8081:8081"
    volumes:
      - ../DevSecOps_Platform_Backend/deploy/nginx/envirotest.docker.conf:/etc/nginx/nginx.conf:ro
      - ../DevSecOps_Platform_Backend/deploy/nginx/proxy-headers.conf:/etc/nginx/conf.d/proxy-headers.conf:ro

volumes:
  postgres_data:
