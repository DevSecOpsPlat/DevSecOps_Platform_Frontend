<aside class="adm-sidebar">
  <div class="adm-sidebar-brand">
    <div class="adm-sidebar-name">EnviroTest <span class="adm-sidebar-tag">Admin</span></div>
    <div class="adm-sidebar-sub">Console de gouvernance</div>
  </div>

  <nav class="adm-nav" aria-label="Navigation administration">
    <div class="adm-nav-group" *ngFor="let group of groups">
      <p class="adm-nav-label">{{ group.label }}</p>
      <a
        *ngFor="let item of group.items"
        class="adm-nav-item"
        [routerLink]="item.link"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }"
      >
        <span class="adm-nav-text">{{ item.label }}</span>
        <span class="adm-nav-badge" *ngIf="item.badge === 'alerts' && unreadAlerts > 0">{{ unreadAlerts }}</span>
      </a>
    </div>
  </nav>

  <div class="adm-sidebar-foot">
    <a class="adm-nav-item" routerLink="/home">
      <span class="adm-nav-text">← Retour au portail</span>
    </a>
  </div>
</aside>
