<ol class="adm-timeline" *ngIf="events.length">
  <li class="adm-timeline-item" *ngFor="let e of events">
    <span class="adm-timeline-dot" [ngClass]="'adm-timeline-dot--' + tone(e)" aria-hidden="true"></span>
    <div
      class="adm-timeline-card"
      [class.is-link]="isClickable(e)"
      [attr.tabindex]="isClickable(e) ? 0 : null"
      [attr.role]="isClickable(e) ? 'link' : null"
      (click)="isClickable(e) && open(e)"
      (keydown.enter)="isClickable(e) && open(e)"
    >
      <div class="adm-timeline-body">
        <p class="adm-timeline-title">{{ label(e) }}</p>
        <p class="adm-timeline-text" *ngIf="e.message">{{ e.message }}</p>
        <div class="adm-timeline-meta" *ngIf="e.applicationName || e.environmentName || e.actorUsername">
          <span class="adm-chip" *ngIf="e.applicationName">{{ e.applicationName }}</span>
          <span class="adm-chip adm-chip--mono" *ngIf="e.environmentName">{{ e.environmentName }}</span>
          <span class="adm-chip" *ngIf="e.actorUsername">{{ e.actorUsername }}</span>
        </div>
      </div>
      <time class="adm-timeline-time">{{ toDate(e.occurredAt) | timeAgo }}</time>
    </div>
  </li>
</ol>

<div class="adm-empty" *ngIf="!events.length">
  <p class="adm-empty-text">{{ emptyText }}</p>
</div>
