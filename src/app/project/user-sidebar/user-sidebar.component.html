<!-- Sidebar compte / réclamations — parcours projet utilise envirotest-nav-sidebar -->
<aside class="user-sidebar" *ngIf="authService.isLoggedIn$ | async">
  <div class="sidebar-header">
    <div class="brand">
      <div class="brand-title">EnviroTest</div>
      <div class="brand-badge">beta</div>
    </div>
    <div class="brand-subtitle">On‑Demand Environments</div>
  </div>

  <nav class="sidebar-sections">
    <section class="sidebar-section">
      <h3 class="section-label">Compte</h3>
      <div class="nav-items">
        <button type="button" class="nav-item" (click)="navigate('/projects')">
          <span class="nav-dot"></span>
          <span class="nav-text">Projets</span>
        </button>
        <button type="button" class="nav-item" (click)="navigate('/reclamations')" [class.active]="isReclamationsRoute()">
          <span class="nav-dot"></span>
          <span class="nav-text">Réclamations</span>
        </button>
        <button type="button" class="nav-item" (click)="navigate('/profile')">
          <span class="nav-dot"></span>
          <span class="nav-text">Profil</span>
        </button>
      </div>
    </section>
  </nav>
</aside>
