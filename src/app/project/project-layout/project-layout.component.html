<div class="mal-shell" *ngIf="isLoggedIn">
  <app-envirotest-nav-sidebar></app-envirotest-nav-sidebar>
  <div class="mal-body">
    <app-service-context-bar></app-service-context-bar>
    <main class="mal-main">
      <div class="am-loading" *ngIf="loading">Chargement…</div>
      <div class="am-alert am-alert-error" *ngIf="error">{{ error }}</div>
      <router-outlet *ngIf="!loading && !error"></router-outlet>
    </main>
  </div>
</div>
