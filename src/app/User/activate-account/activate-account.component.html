<div class="activate-page">
  <div class="activate-card">
    <p class="kicker">EnviroTest</p>
    <h1>Activation du compte</h1>
    <p class="lead">Définissez votre mot de passe pour finaliser la création de votre compte.</p>

    <div class="banner success" *ngIf="success">{{ success }}</div>
    <div class="banner error" *ngIf="error">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="token && !success">
      <div class="field">
        <label for="new-password">Nouveau mot de passe</label>
        <div class="pwd-wrap">
          <input id="new-password" [type]="showNewPassword ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" />
          <button type="button" class="pwd-eye" (click)="showNewPassword = !showNewPassword"
                  [attr.aria-label]="showNewPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                  [attr.title]="showNewPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <svg *ngIf="!showNewPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showNewPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0112 5c6 0 10 7 10 7a17.6 17.6 0 01-3.2 4M6.2 6.2C3.6 8 2 12 2 12s4 7 10 7a10 10 0 005.8-1.8"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
        <app-password-requirements [password]="form.get('newPassword')?.value ?? ''"></app-password-requirements>
      </div>

      <div class="field">
        <label for="confirm-password">Confirmer le mot de passe</label>
        <div class="pwd-wrap">
          <input id="confirm-password" [type]="showConfirmPassword ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" />
          <button type="button" class="pwd-eye" (click)="showConfirmPassword = !showConfirmPassword"
                  [attr.aria-label]="showConfirmPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                  [attr.title]="showConfirmPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'">
            <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0112 5c6 0 10 7 10 7a17.6 17.6 0 01-3.2 4M6.2 6.2C3.6 8 2 12 2 12s4 7 10 7a10 10 0 005.8-1.8"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>
          </button>
        </div>
        <span class="hint error" *ngIf="passwordsMismatch">Les mots de passe ne correspondent pas</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading || form.invalid || passwordsMismatch || !newPasswordStrong">
        {{ loading ? 'Activation…' : 'Activer mon compte' }}
      </button>
    </form>

    <a routerLink="/sign-in" class="back-link">Retour à la connexion</a>
  </div>
</div>
